<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catdoku</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
  
	:root { /* https://htmlcolorcodes.com/colors/ */
	--colour0: MediumSeaGreen;
	--colour1: #A051B4; /* Purple */
	--colour2: Violet; /* Pink */
	--colour3: #6666FF; /* Blue */
	--colour4: #FF5F5F; /* Red */
	--colour5: #FFA127; /* Mango/Dark Orange */
	--colour6: #B6681F; /* Brown */
	--colour7: #E1C16E; /* Yellow/Beige */
	--colour8: #64B5F6; /* Light Blue */
	--colour9: #007373; /* Teal/Dark Green */
	--primary: #2d2d2d; /* Almost black for text */
	--bg: #e0e0e0; /* Grey background */
	--shadow-light: #ffffff;
	--shadow-dark: #bebebe;
	--font: 'Fredoka', sans-serif;
	}

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--bg);
      border-radius: 3%;
      box-shadow: 10px 10px 30px var(--shadow-dark), -10px -10px 30px var(--shadow-light);
      padding: 0.5% 0.5%;
      text-align: center;
    }

    .title {
      font-size: 2.2rem;
      margin-bottom: 15px;
      font-weight: 600;
      color: var(--primary);
    }

    .restart {
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -o-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    
    .next {
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -o-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    
    .gameBoard {
      gap: 7px; /* between cells */
      margin-bottom: 1px;
      margin-left: 1px;
      margin-right: 1px;
    }

    .gameBoard.cats6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
    }

    .gameBoard.cats7 {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .gameBoard.cats8 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
    }

    .gameBoard.cats10 {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
    }

    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: var(--primary);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 18%;
	  font-size: 3rem; 
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .cell.cats6 {
      font-size: clamp(0.3rem, 9.8vw, 3.5rem);
    }
    .cell.cats7 {
      font-size: clamp(0.3rem, 8.1vw, 3.0rem);
    }
    .cell.cats8 {
      font-size: clamp(0.3rem, 6.6vw, 2.5rem); 
    }
    .cell.cats10 {
      font-size: clamp(0.3rem, 5.3vw, 2.0rem); 
    }

    .cell.colour0 { background-color: var(--colour0); }
    .cell.colour1 { background-color: var(--colour1); }
    .cell.colour2 { background-color: var(--colour2); }
    .cell.colour3 { background-color: var(--colour3); }
    .cell.colour4 { background-color: var(--colour4); }
    .cell.colour5 { background-color: var(--colour5); }
    .cell.colour6 { background-color: var(--colour6); }
    .cell.colour7 { background-color: var(--colour7); }
    .cell.colour8 { background-color: var(--colour8); }
    .cell.colour9 { background-color: var(--colour9); }
    
  </style>  
</head>

<body>

  <div class="container">
    <div class="title" style="user-select: none">
      <span id="restart" class="restart">↩️</span>
      &nbsp;&nbsp;&nbsp;
      <span id="title">Catdoku</span>
      &nbsp;&nbsp;&nbsp;
      <span id="next" class="next">➡️</span>️
    </div>
    <div class="game-board" id="gameBoard"></div>
  </div>

  <script>

//#########################  Graphic Definitions  #########################
  
//  https://www.w3schools.com/html/html_emojis.asp
//  https://www.quackit.com/character_sets/emoji/emoji_v3.0/unicode_emoji_v3.0_characters_all.cfm  
    const correctEmoji = '😺';
	const errorEmoji = '❌';
	const crossEmoji = '✕';	// multiply
    const finishedEmoji = '😻';
	
    const allColours = ['colour0', 'colour1', 'colour2', 'colour3', 'colour4', 
    				'colour5', 'colour6', 'colour7', 'colour8', 'colour9']

    
//#########################  Game Constants and Variables  #########################


    const gameBoard = document.getElementById('gameBoard');
	const title = document.getElementById('title');
	title.title = ("Catdoku Version 2.0");
	const restart = document.getElementById('restart');
	restart.title = ("Restart this puzzle");
	restart.onclick = () => restartGame();	
	const next = document.getElementById('next');
	next.title = ("Next puzzle");	
	next.onclick = () => nextGame();


	const debugging = false;

	const rowDelta = [-1, 0, 1, 0];
	const colDelta = [0, 1, 0, -1];
	// make sure these are in clock-wise order for the random walk algorithm
		
    const giveUp = 1_000_000;
    var attempts = 0;
    var colourMethod = 0;
    
    var cats = 6; // starting with 6x6 grid
    var catsFound = 0;
    const noColour = -1;
    var colours = [];
	// the colours used for a puzzle, shuffled for each puzzle
    
	var catCells = [];
	// for each cat a list of the cells of that colour
    
    var catColumn = [];
    // for each row the column which has the cat
    

//#########################  Utilities  #########################


    function randomNumber(range) {
    	return ((range * Math.random()) | 0);
    }


    function pickRandom(array) {
		return array[randomNumber(array.length)];
	}
	
	
    function shuffleRandom(array) {
		let currentIndex = array.length;
		// While there remain elements to shuffle...
		while (currentIndex != 0) {
	    	// Pick a remaining element...
    		let randomIndex = randomNumber(currentIndex);
    		currentIndex--;
		    // And swap it with the current element.
    		[array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];		
    	}
	}
	

//#########################  Debugging  #########################
	
	
	function debugSummary() {
		console.log('======= debug information =======')
		for (let c = 0; c < cats; c++) {
			console.log('grid', c, JSON.stringify(grid[c]));
		}
		cells = 0;
		for (let c = 0; c < cats; c++) {
			len = catCells[c].length;
			cells = cells + len;
			console.log(len, 'catCells for cat', c, JSON.stringify(catCells[c]));
		}
		console.log('total cat cells', cells);
		console.log('catColumn', JSON.stringify(catColumn));			
		console.log('cats', cats);
		console.log('attempts', attempts);	
		console.log('colourMethod', colourMethod);
	}
	
	
//#########################  Main Program and Game Play  #########################


	game();
		
	
	function game() {	
    	setBoard();
    	createCells(cats);
		if (debugging) {
			console.clear();
		}
		colours = allColours.slice(0, cats)
		shuffleRandom(colours);
		if (cats < 10) {
			colourMethod = randomNumber(8);
		} else {
			colourMethod = randomNumber(5);			
		}

	    if (cats > 8) {
		    title.innerText = "Wait...";
			setTimeout(function() {
				findPuzzle();
			}, 20); 
	    } else {
			findPuzzle();
	    }
	}
    

   	function findPuzzle() {
		start = performance.now();
		for (let i = 0; i < giveUp; i++) {
			attempts = i+1;
			initState();
		    distributeCats();
			if (colourMethod == 0) { colourGrid3(2); }
			if (colourMethod == 1) { colourGrid3(4); }
			if (colourMethod == 2) { colourGrid3(5); }  
			if (colourMethod == 3) { colourGrid3(6); }
			if (colourMethod == 4) { colourGrid3(8); }
			if (colourMethod == 5) { colourGrid0(); } // too slow for 10x10 grid		    
			if (colourMethod == 6) { colourGrid1(); } // too slow for 10x10 grid		    
			if (colourMethod == 7) { colourGrid2(); } // too slow for 10x10 grid
    		if (tooManySmallColours()) {
    			continue; // try again
    		}
			if (uniqueSolution()) {
				break;
			}
			if (attempts == giveUp) {
				console.log('Cannot find a valid puzzle, giving up')
			    throw new Error("Execution aborted");
			}
		}
		stop = performance.now();
		if (debugging) {
			debugSummary();
			console.log(attempts, 'attempts in', (stop - start), 'ms', '(', (stop - start)/attempts, 'ms/attempt)')
		}
		paintGrid();
		title.innerText = "Catdoku";
	}


	function nextGame() {
		removeCells();
		unsetBoard();
		switch(cats) {
			case 6: 
				cats = 7;
				break;
			case 7: 
				cats = 8;
				break;
			case 8: 
				cats = 10;
				break;
			case 10: 
				cats = 6;
		}
		catsFound = 0;
		game();
	}
	    
    
	function initState () {
		catCells = Array.from({length: cats}, () => []);
		// initialize cats x cats grid and fill with noColour
	    grid = Array(cats);
    	for (var i = 0; i < cats; i++) {
    		grid[i] = Array(cats).fill(noColour);
	   	}
	}

    
//#########################  Board Handling  #########################


    function setBoard() {
    	boardStyle = 'cats' + cats.toString();
    	gameBoard.classList.add('gameBoard');
    	gameBoard.classList.add(boardStyle);
    }


    function unsetBoard() {
    	boardStyle = 'cats' + cats.toString();
		gameBoard.classList.remove(boardStyle);
		gameBoard.classList.remove('gameBoard');				
	}
	
	
    function createCells(size) {
    	catStyle = 'cats' + size.toString()
		for (let r = 0; r < cats; r++) {
			for (let c = 0; c < cats; c++) {
        		const cell = document.createElement('div');
        		cell.classList.add('cell');
        		cell.classList.add(catStyle);
				cell.classList.add(colours[noColour]);
        		cell.dataset.row = r;
    			cell.dataset.column = c;
        		cell.dataset.found = 0;
        		cell.dataset.crossed = 0;
    			cell.textContent = '';
        		cell.onclick = () => clickCell(cell);
        		cell.ondblclick = () => dblclickCell(cell);
        		gameBoard.appendChild(cell);
        	}
    	}
    }


    function removeCells() {
        gameBoard.innerHTML = '';
 	}
 	

	function paintGrid() {	
		for (var cell = gameBoard.firstChild; cell !== null; cell = cell.nextSibling) {
			for (let c = 0; c < cats; c++) {
				cell.classList.remove(colours[c]);
			}	
			colour = grid[cell.dataset.row][cell.dataset.column];
			if ( colour != noColour) {
				cell.classList.add(colours[colour]);
			}		
		}
	}
     	

//#########################  Find Random Legal Cat Positions  #########################


    function distributeCats() {

		catColumn = Array(cats);
		for (let i = 0; i < cats; i++) {
			catColumn[i] = i;
		}

		for (let j = 0; j < 1000; j++) {
			shuffleRandom(catColumn);
			valid = true;
			for (let i = 0; i < cats - 1; i++) {
				if ((Math.abs(catColumn[i] - catColumn[i + 1])) < 2) {
					valid = false;
					break;
				}
			}
			if (valid) {
				return
			}
		}
		console.log("could not distribute cats");
	    throw new Error("Execution aborted");
	}


//#########################  Grid Colouring Methods  #########################

		
	function colourGrid0() {
	//
	// repeat until done {
	//     for each cat, starting at a random cat
	//         if that cat was still extendable last time around
    //             for each of that cat's cells 
    //                 try to extend that cell in a random direction
	// }
	//
	// Cats with more coloured cells get extended more
	// This often results in one larger colour field 
	// Which is an interesting kind of puzzle in its own right

    	// enter each cat in the grid and catCells
		for (let row = 0; row < cats; row++) {
			col = catColumn[row];
        	catCells[row].push([row, col]);
        	grid[row][col] = row;
		}

    	// colour the rest, keeping the cells for each colour connected
    	var extendable = Array(cats).fill(true);
    	count = cats; // the cats own positions are coloured already
    	gridSize = cats * cats;
		while (count < gridSize) {
		
			// pick a random cat from the still expandable cats
			cat = randomNumber(cats)			
			for (let i = 0; i < cats; i++) {
				if (extendable[cat]) {break};				
				cat = (cat + 1) % cats
			}
			
	        // start at a random position in the list of cells already coloured for that cat
	    	catLength = catCells[cat].length;
        	p = randomNumber(catLength);
	        // try extending for each cell for this cat
	        extended = false;
		  	for (let i = 0; i < catLength; i++) {
		  		let [row, col] = catCells[cat][p];
	            p = (p + 1) % catLength;

		  		b = randomNumber(4);
		  		// find random empty neighbour and colour it
				for (let i = 0; i < 4; i++) {
					br = row + rowDelta[b]
					bc = col + colDelta[b]
					b = (b + 1) % 4
					if (br < 0 || br == cats || bc < 0 || bc == cats) {
						continue
					}
					if (grid[br][bc] == noColour) { 
			            grid[br][bc] = cat;
  	    				catCells[cat].push([br, bc]);
      				    count += 1;
      				    extended = true;
       				    break;
					}
				}
			}
        	if (! extended) {
            	extendable[cat] = false;
        	}
		}
	}    	
	

	function colourGrid1() {
	//
	// keep track of empty/full status of all cells
	// repeat until done {
	//     starting at a random cell, walk the grid to find an empty cell with a coloured neighbour
	//     fill that empty cell with the colour of a random coloured neighbour
	// }

    	var empty = Array(cats * cats).fill(true);

      
    	// enter each cat in the grid and catCells
    	// set empty accordingly
		for (let row = 0; row < cats; row++) {
			col = catColumn[row];
        	catCells[row].push([row, col]);
        	grid[row][col] = row;        	
			empty[row * cats + col] = false;
		}
		
    	// colour the rest, keeping the cells for each colour connected
    	count = cats; // the cats own positions are coloured already
		gridSize = cats * cats;
		while (count < gridSize) {
		
			extended = false;
			// start at a random cell number
			c = randomNumber(gridSize)			
			// walk the grid until finding an empty cell
			for (let i = 0; i < gridSize; i++) {
				if (! empty[c]) {
					c = (c + 1) % gridSize;
					continue;
				}
		  		// in a random order, look for a coloured bordering cell
		  		row = (c/cats)| 0;
		  		col = c % cats;
		  		b = randomNumber(4);
				for (let j = 0; j < 4; j++) {				
					br = row + rowDelta[b]
					bc = col + colDelta[b]
					b = (b + 1) % 4
					if (br < 0 || br == cats || bc < 0 || bc == cats) {
						continue;
					}
					borderingColour = grid[br][bc];
					if (borderingColour != noColour) { 
			            grid[row][col] = borderingColour;
      				    catCells[borderingColour].push([row, col]);
						empty[row * cats + col] = false;
   					    count += 1;
  					    extended = true;
  					    break; // stop looking for neighbours
					}
				}
				if (extended) {
					break; // stop walking the grid
				}				
			}
		}
	}    
		
	
	function colourGrid2() {
	//
	// maintain a list of empty cells in an array
	// shuffle their order randomly
	// repeat until done {
	//     find the next empty cell with a coloured neighbour
	//     fill that empty cell with the colour of a random coloured neighbour
	// }
	
    	var emptyLength = cats * cats;
    	var empty = Array(emptyLength);
		for (let i = 0; i < emptyLength; i++) {
			empty[i] = i;
		}
		shuffleRandom(empty);
		
		function deleteEmpty(cell) {
			const index = empty.indexOf(cell);
			emptyLength--;
			last = empty.pop();
			if (index < emptyLength) {
				empty[index] = last;
			}
		}
		
    	// enter each cat in the grid and catCells
		for (let row = 0; row < cats; row++) {
			col = catColumn[row];
        	catCells[row].push([row, col]);
        	grid[row][col] = row;
        	deleteEmpty(row * cats + col);
		}

    	// colour the rest, keeping the cells for each colour connected
    	count = cats; // the cats own positions are coloured already
    	gridSize = cats * cats;
		// walk the empty cells to find an empty cell with a coloured neighbour to extend			
		c = 0;
		while (count < gridSize) {
			emptyCell = empty[c];
			// in a random order, look for an empty bordering cell to colour
	  		row = (emptyCell/cats)| 0;
	  		col = emptyCell % cats;
	  		d = randomNumber(4); // pick a random dircetion
			for (let j = 0; j < 4; j++) {				
				br = row + rowDelta[d]
				bc = col + colDelta[d]
				d = (d + 1) % 4
				if (br < 0 || br == cats || bc < 0 || bc == cats) {
					continue;
				}
				borderingColour = grid[br][bc];
				if (borderingColour != noColour) {
		            grid[row][col] = borderingColour;
 				    catCells[borderingColour].push([row, col]);
					deleteEmpty(emptyCell);
				    count += 1;
				    extended = true;
				    break; // stop looking for neighbours
				}
			}
			c = (c + 1) % emptyLength;			
		}
	}

	
	function colourGrid3(howStraight) {
	//
	// a random walk is a walk that goes straight, left or right,
	// until it hits a coloured cell or walks off the grid.
	//
	// maintain a list of empty cells in an array
	// shuffle their order randomly too allow cheap random selection
	//
	// expand each cat with a single random walk in their own colour
	// while removing these cells from the empty list
	//
	// repeat until done {
	//     start from the next random empty cell and perform a random walk
	//	   if the walk ends at a coloured cell, add the whole walk to that colour
	//     if the walk ends at itself or walks of the grid, discard it
	// }
	
    	var emptyLength = cats * cats;
    	var empty = Array(emptyLength);
		for (let i = 0; i < emptyLength; i++) {
			empty[i] = i;
		}
		shuffleRandom(empty);
		
		function deleteEmpty(cellNr) {
			const index = empty.indexOf(cellNr);
			emptyLength--;
			last = empty.pop();
			if (index < emptyLength) {
				empty[index] = last;
			}
		}		
		
		var track = [];

		function adoptTrack(colour) {
			while (track.length > 0) {
				cellNr = track.pop();
				row = (cellNr/cats) | 0;
				col = cellNr % cats;
			   	catCells[colour].push([row, col]);
        		grid[row][col] = colour;
				deleteEmpty(cellNr);
			}
		}
		
		function newDirection(d) {
			r = randomNumber(howStraight);
			if (r == 0) {
				return (d + 1) % 4 // right
			}
			if (r == 1) {
				return (d + 3) % 4 // left
			}
			return d; // keep same direction
		}	

		function randomWalk (row, col) {
			track = []; // make the track empty
			// include the starting empty cell in the track
			track.push(row * cats + col);
	  		d = randomNumber(4); // pick a direction
			for (i = 0; i < cats * cats; i++) { // walk forever
				br = row + rowDelta[d];
				bc = col + colDelta[d];
				if (br < 0 || br == cats || bc < 0 || bc == cats) {
					// walked of the grid
					return;
				}
				// still on the grid
				hitColour = grid[br][bc];
				if (hitColour != noColour) {
					adoptTrack(hitColour);
					return;					
				} else {
					// still walking on noColour, but could be my own tracks
					hitNr = br * cats + bc;
					if (track.indexOf(hitNr) > -1) {
						// random walk hit itself, don't use the track
						return;
					}
					// walk continues
					track.push(hitNr); 
				} 		
				row = br;
				col = bc;
				// choose new random next direction, anything except backwards
				d = newDirection(d);
			}
		}									
	
		function randomCatWalk (row, col) {
			// note that the colour of cat matches its row number
			let myColour = row;
	  		d = randomNumber(4); // pick a random direction
			for (i = 0; i < cats * cats; i++) { // walk forever
				br = row + rowDelta[d];
				bc = col + colDelta[d];
				if (br < 0 || br == cats || bc < 0 || bc == cats) {
					// walked Cat of the grid, end of walk
					return;
				}
				// still on the grid
				hitColour = grid[br][bc];
				if (hitColour != noColour) {
					// walk did hit a coloured cell, end of walk
					return;
				} 
				// walk continues
				catCells[myColour].push([br, bc]);
				grid[br][bc] = myColour;
       			deleteEmpty(br * cats + bc);	
				// choose the next direction, anything except backwards
				row = br;
				col = bc;
				r = randomNumber(4);
				if (r == 4) {r = 2} // instead of backwards, go straight
				d = (d + r) % 4 // left, straight, or right
			}
		}									

    	// enter each cat in the grid and in catCells
		for (let row = 0; row < cats; row++) {
			col = catColumn[row];
        	catCells[row].push([row, col]);
        	grid[row][col] = row;
        	deleteEmpty(row * cats + col);
		}

    	// for each cat perform one random walk
		for (let row = 0; row < cats; row++) {
			col = catColumn[row];
			randomCatWalk(row, col);
		}

    	// performing random walks from empty cells until the whole grid is coloured
    	gridSize = cats * cats;
		cell = 0;
		for (i = 0; i < 10_000; i++) { // do walks forever
			// the first empty cell of the random walk
			emptyCell = empty[cell];
			row = (emptyCell/cats) | 0;
	  		col = emptyCell % cats;
	  		randomWalk(row, col);
			if (emptyLength == 0) {
				break;
			}
			cell = (cell + 1) % emptyLength;	  		
		}
	}


//#########################  Check that Puzzle is Valid  #########################


	function tooManySmallColours() {
		var singleCount = 0;
		var smallCount = 0;
		for (let c = 0; c < cats; c++) {
			if (catCells[c].length == 1) {
				singleCount++;
			}
			if (catCells[c].length < 5) {
				smallCount++;
			}
		}
		return (singleCount > 1 || smallCount > 3);
	}
	
	
	function conflict(cel1, cel2) {
		return (Math.abs((cel2[0] - cel1[0])*(cel2[1] - cel1[1])) < 2);
	}
    
    
	function uniqueSolution() {
		solutionCount = 0;
	    attempt = [];

		function uniqueSolutionRecursive(cat) {
			for (let c = 0; c < catCells[cat].length; c++) {
				cell = catCells[cat][c];
	    		conflicts = false
		    	for (let lowerCat = 0; lowerCat < cat; lowerCat++) {
	    			if (conflict(cell, attempt[lowerCat])) {
	    				conflicts = true;
	    				break;
	    			}
	    		}
	    		if (conflicts) {
	    			continue; // try next cell for this cat
	    		}
	    		if (cat == cats - 1) {
					// last cat doesn't conflict, found solution
	    			solutionCount++;
	    		} else {
					// place cat, try next cat
	    			attempt.push(cell);
	    			uniqueSolutionRecursive(cat + 1);
	    			attempt.pop();
	    		}
	    		if (solutionCount > 1) {
					// no unique solution
	    			return
	    		}
		    }
		}
		// outer function
		uniqueSolutionRecursive(0);
		return (solutionCount == 1);
	}    
        
    
//#########################  On Click and Double Click  #########################

    
    var timer;
    
    
    function restartGame() {
		catsFound = 0;
		for(var cell = gameBoard.firstChild; cell!==null; cell=cell.nextSibling) {
	   		cell.dataset.found = 0;
			cell.dataset.crossed = 0;	
			cell.textContent = '';
		}
    }
    
    
    function clickCell(cell) {
	    if (timer) clearTimeout(timer);
    	timer = setTimeout(function() {  
	    	if (catsFound == cats || cell.dataset.found == 1 || cell.textContent == errorEmoji) {
				return;
	    	}
			if (cell.dataset.crossed == 1) {
				cell.textContent = '';		
				cell.dataset.crossed = 0;	
			} else {
				cell.textContent = crossEmoji;			
				cell.dataset.crossed = 1;	
			}
    	}, 250);
    }
    
    
    function dblclickCell(cell) {
	    if (timer) clearTimeout(timer);
		if (catColumn[cell.dataset.row] == cell.dataset.column) {
			catsFound++;
			if (catsFound == cats) {	
				for(var cell = gameBoard.firstChild; cell!==null; cell=cell.nextSibling) {
					r = cell.dataset.row;
					c = cell.dataset.column;
					if (cell.dataset.crossed == 1) {
						cell.textContent = '';		
						cell.dataset.crossed = 0;	
					}
					if (catColumn[r] == c) {
						cell.textContent = finishedEmoji;
					}
				}
			} else {
				cell.textContent = correctEmoji;
		   		cell.dataset.found = 1;
				cell.dataset.crossed = 0;	
			}
    	} else {
			cell.textContent = errorEmoji;
			cell.dataset.crossed = 0;	
    	}   
    }
